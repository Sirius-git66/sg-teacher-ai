name: Sentinel Daily

on:
  schedule:
    - cron: '0 0 * * *'   # 8:00 AM SGT
  workflow_dispatch:

concurrency:
  group: sentinel-main
  cancel-in-progress: false

jobs:
  sentinel:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Sentinel
        id: sentinel
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set +e
          python run_daily.py
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Commit changes if build succeeded
        if: steps.sentinel.outputs.exit_code == '0'
        run: |
          git config user.name "Sentinel Bot"
          git config user.email "sentinel@sg-teacher-ai"

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Sentinel: daily run $(date -u +%Y-%m-%d)"

          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "Push attempt $i failed, retrying..."
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "Could not push after 3 attempts."
          exit 1
