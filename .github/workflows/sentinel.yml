name: Sentinel Daily

on:
  schedule:
    # 8:00 AM SGT = 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:  # allow manual trigger

jobs:
  sentinel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Sentinel
        id: sentinel
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python run_daily.py
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Commit changes if build succeeded
        if: steps.sentinel.outputs.exit_code == '0'
        run: |
          git config user.name "Sentinel Bot"
          git config user.email "sentinel@sg-teacher-ai"
          git add -A
          git diff --cached --quiet || git commit -m "Sentinel: daily run $(date -u +%Y-%m-%d)"
          git push
